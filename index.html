<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digitalizacija Beauty Industrije 2026 | Salon Pro × Z&D Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#c9a84c;--gold-light:#e8d5a3;--gold-dark:#8a6020;--gold-dim:#5a4820;--black:#080808;--black2:#0d0d0d;--black3:#111;--border:#1e1a10;--border-gold:#2a2014;}
html{scroll-behavior:smooth}
body{background:var(--black);color:var(--gold-light);font-family:'Montserrat',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.4;}
.hero{position:relative;padding:60px 24px 48px;text-align:center;border-bottom:1px solid var(--gold-dark);overflow:hidden;}
.hero-title{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,5vw,48px);font-weight:300;color:var(--gold-light);letter-spacing:2px;margin-bottom:8px;}
.q-card{display:none;background:var(--black2);border:0.5px solid var(--border-gold);border-radius:4px;padding:36px 32px;margin-top:20px;position:relative;animation:fadeUp .4s ease both;}
.q-card.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.btn-next{background:transparent;border:1px solid var(--gold);border-radius:2px;padding:13px 36px;color:var(--gold);font-family:'Montserrat',sans-serif;font-size:10px;font-weight:600;letter-spacing:4px;text-transform:uppercase;cursor:pointer;transition:all .2s;}
.btn-next:hover{background:var(--gold);color:var(--black);}
.ty{display:none;text-align:center;background:var(--black2);border:0.5px solid var(--border-gold);border-radius:4px;padding:64px 32px;margin-top:20px;}
.ty.active{display:block;}
</style>
</head>
<body>

<script>
  // Presretanje slanja ankete i preusmeravanje na Formspree
  document.addEventListener('submit', function(e) {
    // Proveri da li je ovo forma tvoje ankete (prilagodi selektor ako treba)
    // Ako tvoja anketa nema <form> tag, moraš ga dodati oko glavnog sadržaja
    e.preventDefault();
    const formData = new FormData(e.target);

    fetch('https://formspree.io/f/xjgdgjzv', {
      method: 'POST',
      body: formData,
      headers: { 'Accept': 'application/json' }
    })
    .then(response => {
      if (response.ok) {
        // Sakrij sva pitanja i prikaži Thank You ekran
        document.querySelectorAll('.q-card').forEach(card => card.style.display = 'none');
        const ty = document.querySelector('.ty');
        if(ty) { ty.style.display = 'block'; ty.classList.add('active'); }
      } else {
        alert('Došlo je do greške pri slanju.');
      }
    })
    .catch(error => console.error('Greška:', error));
  });
</script>
</body>
</html>
