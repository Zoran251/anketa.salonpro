<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digitalizacija Beauty Industrije 2026 | Salon Pro × Z&D Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Stilovi ostaju isti kao u tvom originalnom fajlu */
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#c9a84c;--gold-light:#e8d5a3;--gold-dark:#8a6020;--gold-dim:#5a4820;--black:#080808;--black2:#0d0d0d;--black3:#111;--border:#1e1a10;--border-gold:#2a2014;}
html{scroll-behavior:smooth}
body{background:var(--black);color:var(--gold-light);font-family:'Montserrat',sans-serif;min-height:100vh;overflow-x:hidden;}
/* (Dodatni CSS iz tvog fajla je ovdje uključen, skraćeno radi preglednosti) */
.q-card{display:none;background:var(--black2);border:0.5px solid var(--border-gold);border-radius:4px;padding:36px 32px;margin-top:20px;position:relative;animation:fadeUp .4s ease both;}
.q-card.active{display:block;}
.text-input{width:100%;background:#060606;border:0.5px solid var(--border-gold);border-radius:2px;padding:14px 18px;color:var(--gold-light);font-family:'Montserrat',sans-serif;font-size:13px;font-weight:300;letter-spacing:.5px;outline:none;transition:border-color .2s;}
.btn-next{background:transparent;border:1px solid var(--gold);border-radius:2px;padding:13px 36px;color:var(--gold);font-family:'Montserrat',sans-serif;font-size:10px;font-weight:600;letter-spacing:4px;text-transform:uppercase;cursor:pointer;}
</style>
</head>
<body>

<script>
// Tvoj originalni JS kod za navigaciju kroz anketu ostaje isti
// ... (logika za 'answers' objekat, 'q-cards', itd.) ...

// IZMJENA: Funkcija za slanje na Formspree
function submitAnketa(answers, notes) {
    const formAction = "https://formspree.io/f/xjgdgjzv";
    const formData = new FormData();
    
    // Priprema podataka
    formData.append('form-name', 'salon-pro-anketa-2026');
    formData.append('q1_naziv', answers[1] || '');
    formData.append('q2_telefon', answers[2] || '');
    formData.append('q3_termini', answers[3] || '');
    formData.append('q4_zalihe', answers[4] || '');
    formData.append('q5_lojalnost', answers[5] || '');
    formData.append('q6_concierge', answers[6] || '');
    formData.append('q7_kontakt', answers[7] || '');

    fetch(formAction, {
        method: 'POST',
        body: formData,
        headers: { 'Accept': 'application/json' }
    })
    .then(response => {
        if (response.ok) {
            console.log('Podaci poslani!');
            // Ovdje prebaci korisnika na Thank You ekran (ty.classList.add('active'))
        }
    })
    .catch(error => console.error('Greška:', error));
}
</script>
</body>
</html>
